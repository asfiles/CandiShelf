[package]
name = "candishelf"
version = "0.1.0"
description = "Local, offline-first resume shelf for independent recruiters and small teams."
authors = ["CandiShelf"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-or-later"

[lib]
name = "candishelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The demo binary drives real candle embeddings through `candishelf_lib::testkit`,
# which only exists behind the `candle` feature. Marking the requirement here
# keeps `cargo test --no-default-features` (the fast logic job) from trying to
# compile it and failing on the missing module.
[[example]]
name = "embed_cvs"
required-features = ["candle"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }

thiserror = "1"
regex = "1"
once_cell = "1"

# Document text extraction
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
encoding_rs = "0.8"

# Model download + integrity
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"

chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
csv = "1"

# Local LLM embeddings (candle, pure Rust for the model; the tokenizer's regex
# backend `onig` is a build-time-only C dependency with bundled source that is
# statically linked — there is no runtime shared library, so unlike ONNX Runtime
# it needs no shipping/signing of a native lib). Behind the default `candle`
# feature so the fast logic/test CI job can build without the heavy ML tree via
# `--no-default-features`; production builds keep it on.
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }

[features]
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
# opt-level 3 (not "s"): embedding inference is matmul-heavy and benefits from
# speed optimization; the size cost is small next to the model download.
opt-level = 3
strip = true
